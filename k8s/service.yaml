# ---------------------------------------------------------------------------
# Kubernetes Service (M4). NodePort makes the service reachable on the host
# for local clusters (minikube/kind). Access via `kubectl port-forward` or
# `minikube service cats-vs-dogs`.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: cats-vs-dogs
  labels:
    app: cats-vs-dogs
spec:
  type: NodePort
  selector:
    app: cats-vs-dogs
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
