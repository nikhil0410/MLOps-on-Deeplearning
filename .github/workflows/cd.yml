# ---------------------------------------------------------------------------
# Continuous Deployment (M4). Triggered automatically after CI succeeds on main.
# Pulls the freshly-built image, deploys it to an ephemeral Kubernetes (kind)
# cluster using the manifests in k8s/, then runs a post-deploy smoke test.
# The pipeline FAILS if the smoke test fails.
# ---------------------------------------------------------------------------
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-and-smoke-test:
    name: Deploy to Kubernetes (kind) + Smoke Test
    runs-on: ubuntu-latest
    # Only deploy if the CI run succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image built by CI
        run: |
          docker pull "${{ steps.img.outputs.name }}:latest"
          docker tag "${{ steps.img.outputs.name }}:latest" cats-vs-dogs:ci

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mlops

      - name: Load image into kind
        run: kind load docker-image cats-vs-dogs:ci --name mlops

      - name: Deploy manifests
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/cats-vs-dogs --timeout=180s

      - name: Port-forward service
        run: |
          kubectl port-forward svc/cats-vs-dogs 8000:80 > /tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid
          # Wait for the port-forward to become ready.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "service is reachable"; break
            fi
            sleep 2
          done

      - name: Post-deploy smoke test (fails pipeline on error)
        run: python scripts/smoke_test.py --url http://localhost:8000

      - name: Post-deployment performance check
        run: |
          python -m pip install --quiet pillow==10.3.0 pyyaml==6.0.1 numpy==1.26.4
          python scripts/simulate_requests.py --url http://localhost:8000 --n 20

      - name: Show deployment status
        if: always()
        run: |
          kubectl get pods -o wide || true
          kubectl get svc || true

      - name: Tear down port-forward
        if: always()
        run: kill "$(cat /tmp/pf.pid)" 2>/dev/null || true
