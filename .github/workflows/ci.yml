# ---------------------------------------------------------------------------
# Continuous Integration (M3): on every push / PR to main ->
#   checkout -> install deps -> run unit tests -> build & push Docker image.
# The image is published to GitHub Container Registry (GHCR).
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- test ----
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v --cov=src --cov-report=term-missing

  # ------------------------------------------------------ build & push ----
  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # Only publish from pushes to main (not PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install training dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          pip install -r requirements-dev.txt

      - name: Reproduce pipeline (data -> preprocess -> train)
        run: |
          python -m src.data.generate_synthetic
          python -m src.data.preprocess
          python -m src.models.train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.pt
            models/metrics.json
            models/plots/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
